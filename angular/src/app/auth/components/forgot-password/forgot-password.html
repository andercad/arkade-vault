<div class="av-auth-wrap fade-in">
  <div class="auth-card">
    <div class="auth-header">
      <div class="mark"></div>
      <h2 class="neon-cyan">RECUPERAR CONTRASEÑA</h2>
    </div>

    <form novalidate (submit)="submit($event)">
      @if (error(); as message) {
        <div id="forgot-error" class="terminal-error" role="alert">{{ message }}</div>
      }
      @if (soon()) {
        <div class="terminal-notice" role="status">Disponible próximamente.</div>
      }
      <div class="field">
        <label for="forgot-email">Correo electrónico</label>
        <input
          id="forgot-email"
          type="email"
          placeholder="jugador@vault.gg"
          autocomplete="email"
          [value]="email()"
          [attr.aria-invalid]="error() !== null"
          [attr.aria-describedby]="error() ? 'forgot-error' : null"
          (input)="onEmail($event)"
        />
      </div>
      <button class="btn lg full" type="submit">ENVIAR ENLACE</button>
    </form>

    <button type="button" class="btn ghost full back" (click)="back.emit()">
      VOLVER A INICIAR SESIÓN
    </button>
  </div>
</div>
