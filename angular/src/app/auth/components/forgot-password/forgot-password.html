<div class="av-auth-wrap fade-in">
  <div class="auth-card">
    <div class="auth-header">
      <div class="mark"></div>
      <h2 class="neon-cyan">{{ sentTo() ? 'REVISA TU CORREO' : 'RECUPERAR CONTRASEÑA' }}</h2>
    </div>

    @if (sentTo(); as address) {
      <p class="mono sent-text" role="status">
        Si <strong>{{ address }}</strong> tiene una cuenta, recibirás un enlace para elegir una
        nueva contraseña.
      </p>
    } @else {
      <form novalidate (submit)="submit($event)">
        @if (error(); as message) {
          <div id="forgot-error" class="terminal-error" role="alert">{{ message }}</div>
        }
        <div class="field">
          <label for="forgot-email">Correo electrónico</label>
          <input
            id="forgot-email"
            type="email"
            placeholder="jugador@vault.gg"
            autocomplete="email"
            [value]="email()"
            [disabled]="pending()"
            [attr.aria-invalid]="error() !== null"
            [attr.aria-describedby]="error() ? 'forgot-error' : null"
            (input)="onEmail($event)"
          />
        </div>
        <button class="btn lg full" type="submit" [disabled]="pending()">
          {{ pending() ? 'ENVIANDO…' : 'ENVIAR ENLACE' }}
        </button>
      </form>
    }

    <button type="button" class="btn ghost full back" (click)="back.emit()">
      VOLVER A INICIAR SESIÓN
    </button>
  </div>
</div>
