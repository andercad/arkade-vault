<div class="av-auth-wrap fade-in">
  <div class="auth-card">
    <div class="auth-header">
      <div class="mark"></div>
      <h2 class="neon-cyan">NUEVA CONTRASEÑA</h2>
    </div>

    @if (!code()) {
      <div class="terminal-error" role="alert">
        El enlace no es válido o ha caducado. Pide uno nuevo desde el inicio de sesión.
      </div>
      <a routerLink="/login" class="btn ghost login-link">IR A INICIAR SESIÓN</a>
    } @else {
      <form novalidate (submit)="submit($event)">
        @if (error(); as message) {
          <div id="reset-error" class="terminal-error" role="alert">{{ message }}</div>
        }
        <div class="field">
          <label for="reset-pass">Nueva contraseña</label>
          <input
            id="reset-pass"
            type="password"
            placeholder="••••••••"
            autocomplete="new-password"
            [value]="pass()"
            [disabled]="pending()"
            [attr.aria-invalid]="isInvalid('pass')"
            [attr.aria-describedby]="isInvalid('pass') ? 'reset-error' : null"
            (input)="update('pass', $event)"
          />
        </div>
        <div class="field">
          <label for="reset-repeat">Repite la contraseña</label>
          <input
            id="reset-repeat"
            type="password"
            placeholder="••••••••"
            autocomplete="new-password"
            [value]="repeat()"
            [disabled]="pending()"
            [attr.aria-invalid]="isInvalid('repeat')"
            [attr.aria-describedby]="isInvalid('repeat') ? 'reset-error' : null"
            (input)="update('repeat', $event)"
          />
        </div>
        <button class="btn lg submit-btn" type="submit" [disabled]="pending()">
          {{ pending() ? 'GUARDANDO…' : 'CAMBIAR CONTRASEÑA' }}
        </button>
      </form>
    }
  </div>
</div>
