<div class="password-section">
  @if (done() && !open()) {
    <div class="terminal-notice" role="status">Contraseña actualizada.</div>
  }
  @if (!open()) {
    <button type="button" class="btn ghost full" (click)="show()">CAMBIAR CONTRASEÑA</button>
  } @else {
    <form novalidate (submit)="submit($event)">
      @if (error(); as message) {
        <div id="password-error" class="terminal-error" role="alert">{{ message }}</div>
      }
      <div class="field">
        <label for="pw-current">Contraseña actual</label>
        <input
          id="pw-current"
          type="password"
          autocomplete="current-password"
          [disabled]="pending()"
          [attr.aria-describedby]="error() ? 'password-error' : null"
          (input)="onInput('current', $event)"
        />
      </div>
      <div class="field">
        <label for="pw-new">Nueva contraseña</label>
        <input
          id="pw-new"
          type="password"
          autocomplete="new-password"
          [disabled]="pending()"
          (input)="onInput('password', $event)"
        />
      </div>
      <div class="field">
        <label for="pw-repeat">Repetir contraseña</label>
        <input
          id="pw-repeat"
          type="password"
          autocomplete="new-password"
          [disabled]="pending()"
          (input)="onInput('repeat', $event)"
        />
      </div>
      <button class="btn lg full submit-btn" type="submit" [disabled]="pending()">
        {{ pending() ? 'GUARDANDO…' : 'GUARDAR CONTRASEÑA' }}
      </button>
      <button
        type="button"
        class="btn ghost full cancel-btn"
        [disabled]="pending()"
        (click)="cancel()"
      >
        CANCELAR
      </button>
    </form>
  }
</div>
